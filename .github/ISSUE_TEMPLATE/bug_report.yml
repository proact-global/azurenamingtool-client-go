name: Bug Report
description: Report a problem with the client library
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Minimal Go code or steps to reproduce the issue.
      render: go
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: Include any error messages or stack traces.
    validations:
      required: true

  - type: input
    id: module_version
    attributes:
      label: Module Version
      placeholder: "e.g. v0.10.0"
    validations:
      required: true

  - type: input
    id: go_version
    attributes:
      label: Go Version
      placeholder: "e.g. 1.23"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
